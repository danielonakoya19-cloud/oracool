# Render.com blueprint — deploy OraCool AI in a few clicks.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: oracool-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    # NOTE: do NOT set PORT here — Render injects its own PORT and the app
    # binds to it automatically (server.py reads os.environ["PORT"]).
    #
    # All secrets (API keys) go in the Render dashboard → Environment tab,
    # pasted in one shot from RENDER_ENV.txt. They must NEVER be committed.
    plan: free
    healthCheckPath: /api/health
