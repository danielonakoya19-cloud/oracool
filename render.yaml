# Render.com blueprint — deploy OraCool AI in a few clicks.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: oracool-ai
    runtime: python
    buildCommand: ""          # no build step needed (stdlib only)
    startCommand: python3 server.py
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
    # Add your secrets in the Render dashboard (NOT here):
    #   JWT_SECRET, PAYSTACK_SECRET_KEY, PAYSTACK_PUBLIC_KEY,
    #   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY,
    #   OPENAI_API_KEY, GROQ_API_KEY, ADMIN_EMAILS (JSON array), ...
    plan: free
